 mr.onstop=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(ch,{type:mr.mimeType}));a.download='cidade-'+Date.now()+(mr.mimeType.includes('mp4')?'.mp4':'.webm');a.click();send({t:'recstop'});rec=null;$('bR').textContent='⏺ Gravar';$('bR').classList.remove('on')};
 mr.start(1000);rec={rc,mr,t0:T};send({t:'recstart'});$('bR').classList.add('on')}

 X.drawImage(cv,left*cv.width/iw,0,cw*cv.width/iw,cv.height,0,0,rc.width,rc.height);
 for(const l of labels){const rx=(l.x-left)*k,ry=l.y*rc.height/ih;if(rx<0||rx>rc.width)continue;if(l.b)pill(rx,ry-30,l.b,'#fff','#17303f',15);pill(rx,ry,l.t,'rgba(23,48,63,.9)','#fff',14)}
 pill(rc.width/2,90,hr<12?'Bom dia, moradores! ☀️':hr<18?'Boa tarde, moradores! 🌤️':'Boa noite, moradores! 🌙','rgba(255,255,255,.95)','#17303f',26);
 pill(rc.width/2,140,'📹 '+MODES[mode],'#ff6a3d','#fff',18);pill(rc.width/2,rc.height-60,'🏘️ Cidade online','rgba(0,0,0,.45)','#fff',18);
 const s=Math.floor(T-rec.t0);$('bR').textContent='⏹ 0:'+String(s).padStart(2,'0');if(s>=60)rec.mr.stop()}

let ci=0;const swEl=$('sw');
PAL.forEach((c,i)=>{const b=document.createElement('button');b.style.cssText='flex:0 0 36px;height:36px;padding:0;border-radius:50%;background:#'+c.toString(16).padStart(6,'0')+(i?'':';outline:3px solid #fff');
 b.onclick=()=>{ci=i;[...swEl.children].forEach((x,k)=>x.style.outline=k===i?'3px solid #fff':'none')};swEl.appendChild(b)});
$('enter').onclick=()=>{$('err').textContent='';ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
 ws.onopen=()=>{const uid=()=>crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now().toString(36);let dev;try{dev=localStorage.dev||(localStorage.dev=uid())}catch{dev=uid()}send({t:'join',name:$('h').value,pass:$('pw').value,c:ci,dev})};
 ws.onmessage=e=>{const m=JSON.parse(e.data);
  if(m.t==='err')$('err').textContent=m.msg;
  else if(m.t==='err2')tst(m.msg,6);
  else if(m.t==='hello'){$('login').hidden=true;cfg=m.cfg;me={h:m.h};me.p=mk(m.h,m.c);me.p.hi=m.hi%63;me.p.n=m.n;players.set(m.h,me.p);
   const f=houses[me.p.hi].front;me.p.x=f.x;me.p.z=f.z;me.p.on=true;$('who').textContent=m.n}
  else if(m.t==='mis')missions(m);
  else if(m.t==='snap'){me.p.x=m.x;me.p.z=m.z;goal=null}
  else if(m.t==='state')onState(m);
  else if(m.t==='say'){const p=players.get(m.from);if(p)say(p,m.text,5)}
  else if(m.t==='fx'){const p=players.get(m.to);if(p)say(p,m.k==='emoji'?'❤️':'🔔 Toc toc!',2.5);
   if(m.to===me.h)tst(((players.get(m.from)||{}).n||'Alguém')+(m.k==='emoji'?' te mandou ❤️':' tocou a sua campainha 🔔'))}};
 ws.onclose=()=>{if(me)$('info').textContent='Conexão perdida. Recarregue a página.'}};
const v3=new THREE.Vector3();let lt=performance.now();
(function frame(now){
 const dt=Math.min((now-lt)/1000,.05);lt=now;T+=dt;labels=[];
 if(me){stepMe(dt);if(T-sent>.1){sent=T;send({t:'pos',x:me.p.x,z:me.p.z,hx:me.p.hx,hz:me.p.hz})}}
 hos.scale.y+=(Math.max(.05,prog/10)-hos.scale.y)*Math.min(1,dt*3);
 for(const p of players.values()){
  if(p!==me.p&&p.on&&p.tx!==undefined){p.x+=(p.tx-p.x)*Math.min(1,dt*8);p.z+=(p.tz-p.z)*Math.min(1,dt*8)}
  const own=me&&p===me.p;p.g.visible=p.on&&!(own&&mode===2);if(!p.on){p.el.style.display='none';continue}
  const mv=own?!!goal:Math.hypot((p.tx||p.x)-p.x,(p.tz||p.z)-p.z)>.02;
  p.g.position.set(p.x+p.hz*.2,mv?Math.abs(Math.sin(T*9))*.04:0,p.z-p.hx*.2);p.g.rotation.y=Math.atan2(p.hx,p.hz);p.g.rotation.z=mv?Math.sin(T*9)*.06:0;
  p.g.getWorldPosition(v3);v3.y+=.85;v3.project(camera);
  if(v3.z>1||(own&&mode===2)){p.el.style.display='none';continue}
  const bub=T<p.until?p.bub:'',px=(v3.x*.5+.5)*innerWidth,py=(-v3.y*.5+.5)*innerHeight;
  p.el.children[0].textContent=bub;p.el.children[1].textContent=p.n;p.el.style.display='block';labels.push({x:px,y:py,t:p.n,b:bub});
  p.el.style.transform='translate('+px+'px,'+py+'px) translate(-50%,-100%)'}
 if(T%.5<dt)info();cam(dt);renderer.render(scene,camera);if(rec)drawRec();requestAnimationFrame(frame)})(performance.now());
